name: Deploy

on:
  # workflow_dispatch permite disparar el deploy manualmente desde la UI de
  # Actions. Es el modo por defecto (más seguro).
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "deploy" para confirmar'
        required: true
        default: ''

  # Push a main dispara el flujo, pero el job `deploy` está en environment
  # `production` con required reviewers, así que espera aprobación humana
  # antes de tocar la VM.
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Job 1: Build (no toca la VM, no requiere approval) ─────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    # Gate para el trigger manual: exigir que confirm sea "deploy".
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.confirm == 'deploy'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ── Job 2: Deploy (environment protegido con required reviewers) ──────────
  deploy:
    name: Deploy a VM
    needs: build-frontend
    runs-on: ubuntu-latest
    # El environment "production" debe estar creado en:
    #   GitHub → Settings → Environments → New environment → production
    # con "Required reviewers" apuntando a los aprobadores.
    environment:
      name: production
      url: https://${{ secrets.VM_DOMAIN }}/
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [[ -z "$VM_HOST" || -z "$VM_SSH_KEY" ]]; then
            echo "❌ Secrets VM_HOST y/o VM_SSH_KEY no configurados"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync backend
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'node_modules' \
            --exclude 'frontend' \
            --exclude 'frontend-dist' \
            --exclude 'db.sqlite3' \
            --exclude 'media' \
            --exclude 'staticfiles' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./ "$VM_USER@$VM_HOST:/tmp/deploy-backend/"

      - name: Rsync frontend
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            frontend-dist/ "$VM_USER@$VM_HOST:/tmp/deploy-frontend/"

      - name: Apply on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "$VM_USER@$VM_HOST" \
            'sudo /opt/inio-bim/deploy/apply.sh'

      - name: Smoke test HTTPS
        env:
          VM_DOMAIN: ${{ secrets.VM_DOMAIN }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          # Da unos segundos a gunicorn.
          sleep 5

          # Preferir DOMAIN (con cert) sobre HOST (sin cert).
          TARGET="${VM_DOMAIN:-$VM_HOST}"
          SCHEME="https"
          if [[ -z "$VM_DOMAIN" ]]; then
            echo "⚠ VM_DOMAIN no configurado; smoke test cae a HTTP"
            SCHEME="http"
          fi

          BASE="$SCHEME://$TARGET"
          echo "▶ Smoke test contra $BASE"

          # 1. /admin/ debe devolver 302 (redirect a login) o 200.
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/admin/" --max-time 10)
          echo "  /admin/ → $HTTP"
          if [[ "$HTTP" != "302" && "$HTTP" != "200" ]]; then
            echo "❌ Deploy falló: /admin/ devolvió $HTTP"
            exit 1
          fi

          # 2. /api/auth/me/ debe devolver 401 sin token (endpoint vivo pero
          # protegido). Si diera 500 → algo está roto.
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/api/auth/me/" --max-time 10)
          echo "  /api/auth/me/ → $HTTP"
          if [[ "$HTTP" != "401" && "$HTTP" != "403" ]]; then
            echo "❌ Deploy falló: /api/auth/me/ devolvió $HTTP (esperado 401/403)"
            exit 1
          fi

          # 3. HSTS header (solo si estamos por HTTPS).
          if [[ "$SCHEME" == "https" ]]; then
            HSTS=$(curl -sS -I "$BASE/admin/" --max-time 10 | grep -i '^strict-transport-security:' || true)
            if [[ -z "$HSTS" ]]; then
              echo "⚠ Warning: no se recibió Strict-Transport-Security header"
            else
              echo "  HSTS: OK"
            fi
          fi

          echo "✅ Smoke test OK"
