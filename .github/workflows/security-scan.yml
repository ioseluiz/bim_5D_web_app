name: Security scan

# OWASP A06 — detección de dependencias vulnerables.
# Corre en cada PR y semanalmente (lunes 10:00 UTC = 5am Panama).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        # --strict marca fail solo si hay vulns con fix disponible.
        # Reporta también las sin-fix como warnings.
        run: pip-audit -r requirements.txt --strict --disable-pip
        continue-on-error: false

  node:
    name: Node (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frozen)
        run: npm ci

      - name: npm audit (high y críticas fallan)
        # Warnings/moderate se reportan pero no bloquean.
        run: npm audit --audit-level=high
