# Hardening global de nginx — se instala en /etc/nginx/conf.d/
#
# El nginx.conf de Ubuntu hace `include /etc/nginx/conf.d/*.conf;` dentro del
# bloque `http`, así que estas directivas se heredan a todos los server blocks
# de sites-enabled/.

# OWASP A05 — no anunciar la versión. Pasa de "nginx/1.24.0 (Ubuntu)" a
# "nginx" en el header Server y en el footer de las páginas de error.
# (Eliminar el header por completo exigiría nginx-extras + headers-more.)
server_tokens off;

# Silencia el warning "could not build optimal proxy_headers_hash" que emite
# nginx en cada reload por la cantidad de headers custom que enviamos.
proxy_headers_hash_bucket_size 128;
