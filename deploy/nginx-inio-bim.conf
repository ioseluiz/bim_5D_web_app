# INIO BIM 4D/5D — Nginx site (HTTPS)
#
# Este archivo es una PLANTILLA. `deploy/setup-https.sh` lo copia a
# /etc/nginx/sites-available/inio-bim reemplazando ${DOMAIN} por el dominio
# real (p. ej. 20-1-2-3.sslip.io mientras no haya dominio ACP, luego
# inio-bim.pancanal.com).
#
# Instalar/actualizar manualmente (si no usas setup-https.sh):
#   export DOMAIN=<tu-dominio>
#   envsubst '${DOMAIN}' < deploy/nginx-inio-bim.conf \
#     | sudo tee /etc/nginx/sites-available/inio-bim >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/inio-bim /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream inio_bim_gunicorn {
    server unix:/run/gunicorn/gunicorn.sock fail_timeout=0;
}

# ── HTTP: solo redirige a HTTPS (excepto ACME challenge para renewal) ───────
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Certbot escribe aquí durante renewal (webroot mode como fallback).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: aplicación ───────────────────────────────────────────────────────
server {
    # http2 en el listen (sintaxis compatible con nginx 1.24 de Ubuntu 22.04/24.04).
    # nginx 1.25+ acepta `http2 on;` como directiva separada, pero mostrará warning
    # de deprecation de todos modos; esta sintaxis funciona en ambas versiones.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # IFC pueden ser grandes; permitir hasta 500 MB por request.
    client_max_body_size 500M;

    # Timeouts largos para uploads/conversión ffmpeg.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout       300s;

    # ── Frontend React (SPA) ────────────────────────────────────────────────
    root /var/www/inio-bim;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API y admin de Django ──────────────────────────────────────────────
    location /api/ {
        include proxy_params;
        # Necesario para que Django reconozca la conexión como HTTPS
        # (SECURE_PROXY_SSL_HEADER en settings.production).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://inio_bim_gunicorn;
    }

    location /admin/ {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://inio_bim_gunicorn;
    }

    # ── Static files (collectstatic + whitenoise manifest) ─────────────────
    location /static/ {
        alias /opt/inio-bim/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        gzip_static on;
    }

    # ── Media (uploads de usuario: IFC, videos) ────────────────────────────
    location /media/ {
        alias /opt/inio-bim/media/;
        access_log off;
        expires 7d;
    }

    # ── Compresión ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Security headers (OWASP A05) ───────────────────────────────────────
    # HSTS: los pone Django también, pero nginx los añade a assets estáticos
    # que no pasan por gunicorn.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy: restrictivo pero permisivo con lo que el SPA
    # necesita (Google Fonts, web-ifc WASM via blob:).
    # Ajustar si añades más CDNs. 'unsafe-inline' en style-src es necesario
    # para Bootstrap Icons y estilos inline de React.
    #
    # ⚠ DEBE ir en UNA SOLA LÍNEA. nginx NO interpreta la continuación de línea
    # con "\" dentro de strings: manda los backslashes y newlines literales en
    # el header, y HTTP/2 rechaza el response con
    # "curl: (92) Invalid HTTP header field was received".
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── Bloquear acceso a archivos ocultos y sensibles ─────────────────────
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ \.(py|pyc|env|ini|cfg|sqlite3?|bak|log)$ { deny all; }
}
