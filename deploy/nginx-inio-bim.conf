# INIO BIM 4D/5D — Nginx site (HTTPS forzado)
#
# PLANTILLA: el placeholder DOMAIN se sustituye con envsubst. Lo hace automáticamente
# `deploy/apply.sh` en cada deploy (lee el dominio del ALLOWED_HOSTS del .env)
# y también `deploy/setup-https.sh` en el setup inicial.
#
# Render manual (si hiciera falta):
#   export DOMAIN=48-211-218-17.sslip.io
#   envsubst "$"'{DOMAIN}' < deploy/nginx-inio-bim.conf \
#     | sudo tee /etc/nginx/sites-available/inio-bim >/dev/null
#   sudo nginx -t && sudo systemctl reload nginx

upstream inio_bim_gunicorn {
    server unix:/run/gunicorn/gunicorn.sock fail_timeout=0;
}

# ── :80 catch-all — TODO el tráfico HTTP redirige al dominio canónico ───────
#
# Es el único server block del puerto 80, y lleva default_server para capturar
# cualquier Host: la IP pública, un dominio ajeno apuntado aquí, o ninguno
# (HTTP/1.0). Sin esto, entrar por IP terminaba en un error de certificado.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Challenge de certbot para el renewal automático. Gana sobre "/" por ser
    # la prefix location más larga.
    #
    # ⚠ NUNCA añadir `location ~ /\.` (deny de ocultos) a este block: las
    # locations regex ganan a las prefix, y /.well-known/ empieza con punto —
    # bloquearía el renewal y el cert expiraría.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Dominio FIJO, nunca $host. Con $host, entrar por IP redirigía a
    # https://<IP>/ → cert mismatch → el usuario nunca llegaba al sitio.
    # Además, sin header Host (HTTP/1.0) $host valdría "_" literalmente.
    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

# ── :443 catch-all — rechaza el handshake TLS sin exponer nada ──────────────
#
# Un cliente que pide https://<IP>/ no manda SNI (RFC 6066 prohíbe literales
# IP), así que cae aquí. ssl_reject_handshake aborta con un alert TLS
# `unrecognized_name`: el navegador muestra un error de conexión, NO un
# interstitial de certificado con botón "Proceder".
#
# No lleva ssl_certificate a propósito — así la plantilla se puede renderizar
# aunque el cert todavía no exista (bootstrap de setup-https.sh).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}

# ── :443 aplicación — solo responde al dominio canónico (match por SNI) ─────
server {
    # http2 en el listen: sintaxis compatible con nginx 1.24 (Ubuntu 22.04/24.04).
    # nginx 1.25+ prefiere `http2 on;` pero acepta esta con un warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # IFC pueden ser grandes; permitir hasta 500 MB por request.
    client_max_body_size 500M;

    # Timeouts largos para uploads/conversión ffmpeg.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout       300s;

    root /var/www/inio-bim;
    index index.html;

    include /etc/nginx/snippets/inio-bim-security-headers.conf;

    # ── Páginas de error ───────────────────────────────────────────────────
    #
    # Solo 50x. NO añadir `error_page 404 /index.html`: se heredaría a
    # /static/ y devolvería HTML con Content-Type text/html cuando falte un
    # .js hasheado — con nosniff activo el navegador rechaza el módulo con un
    # error de MIME críptico en vez de un 404 limpio. El `try_files` de
    # `location /` ya sirve el SPA con 200 para las rutas de aplicación.
    #
    # Con proxy_intercept_errors off (default) los 500 de Django pasan tal
    # cual; esta página cubre los 502/504 que genera nginx cuando gunicorn
    # está caído — p. ej. la ventana del systemctl restart en apply.sh.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # ── Frontend React (SPA) ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API y admin de Django ──────────────────────────────────────────────
    location /api/ {
        include proxy_params;
        # Necesario para que Django reconozca la conexión como HTTPS
        # (SECURE_PROXY_SSL_HEADER en settings.production).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://inio_bim_gunicorn;
    }

    location /admin/ {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://inio_bim_gunicorn;
    }

    # ── Static files (collectstatic + whitenoise manifest) ─────────────────
    location /static/ {
        alias /opt/inio-bim/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        # ⚠ Declarar add_header aquí DESCARTA los heredados del server block.
        # Hay que re-incluirlos o /static/ se queda sin HSTS, CSP ni nosniff.
        include /etc/nginx/snippets/inio-bim-security-headers.conf;
        gzip_static on;
    }

    # ── Media (uploads de usuario: IFC, videos) ────────────────────────────
    location /media/ {
        alias /opt/inio-bim/media/;
        access_log off;
        expires 7d;
    }

    # ── Compresión ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Bloquear acceso a archivos ocultos y sensibles ─────────────────────
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ \.(py|pyc|env|ini|cfg|sqlite3?|bak|log)$ { deny all; }
}
