# INIO BIM 4D/5D — Nginx site
# Instalar: sudo cp deploy/nginx-inio-bim.conf /etc/nginx/sites-available/inio-bim
#           sudo ln -sf /etc/nginx/sites-available/inio-bim /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx

upstream inio_bim_gunicorn {
    server unix:/run/gunicorn/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # server_name se ignora con default_server; cuando tengas dominio, cambia
    # esta línea a "server_name inio-bim.pancanal.com;" y quita default_server.
    server_name _;

    # IFC pueden ser grandes; permitir hasta 500 MB por request.
    client_max_body_size 500M;

    # Timeouts largos para uploads/conversión ffmpeg.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout       300s;

    # ── Frontend React (SPA) ──────────────────────────────────────────────────
    root /var/www/inio-bim;
    index index.html;

    # SPA fallback: si el archivo no existe, servir index.html
    # (React Router se encarga del enrutamiento del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API y admin de Django ─────────────────────────────────────────────────
    location /api/ {
        include proxy_params;
        proxy_pass http://inio_bim_gunicorn;
    }

    location /admin/ {
        include proxy_params;
        proxy_pass http://inio_bim_gunicorn;
    }

    # ── Static files (collectstatic) ──────────────────────────────────────────
    # Whitenoise sirve como fallback via gunicorn, pero Nginx es más rápido.
    # Los nombres tienen hash (whitenoise Manifest), así que cachear forever
    # es seguro.
    location /static/ {
        alias /opt/inio-bim/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Servir versiones comprimidas si existen (whitenoise las genera)
        gzip_static on;
    }

    # ── Media (uploads de usuario: IFC, videos) ───────────────────────────────
    location /media/ {
        alias /opt/inio-bim/media/;
        access_log off;
        expires 7d;
    }

    # ── Compresión para todo el resto (SPA JS/CSS/HTML) ───────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Seguridad básica ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Bloquear acceso a archivos ocultos y a .py/.env/etc si alguna vez
    # aparecen en /var/www por error.
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ \.(py|pyc|env|ini|cfg|sqlite3?)$ { deny all; }
}
