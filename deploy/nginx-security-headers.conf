# Security headers (OWASP A05) — incluir con `include` en CADA nivel que los
# necesite.
#
# ⚠ nginx hereda `add_header` SOLO si el nivel actual no define ninguno. Un
# `location` que declare su propio `add_header` (p. ej. Cache-Control) DESCARTA
# todos los del server block. Por eso este archivo se incluye tanto en el
# server como dentro de `location /static/`.
#
# Instalado por apply.sh en /etc/nginx/snippets/inio-bim-security-headers.conf

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content-Security-Policy — DEBE ir en UNA SOLA LÍNEA. nginx NO interpreta "\"
# como continuación dentro de strings: mandaría los backslashes y newlines
# literales y HTTP/2 rechaza el response ("Invalid HTTP header field").
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
